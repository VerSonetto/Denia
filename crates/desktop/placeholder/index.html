<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Denia</title>
    <style>
      /* 启动过渡页:服务绑定成功后窗口会导航到真实控制台,这一页只在启动的
         几百毫秒里可见。刻意做得极简,避免用户把它当成"卡住了"。

         同一个页面兼作启动失败的兜底页:壳在页面加载前注入
         `window.__DENIA_FATAL__`,有值就渲染错误而不是"正在启动"。
         走内嵌资源而不是 data: URL —— 实测 WebView2 不渲染 data: 顶层导航,
         那会让用户对着一片空白窗口猜发生了什么。 */
      :root { color-scheme: dark light; }
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0d0d0d;
        color: #e8e8e8;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .box { text-align: center; max-width: 42rem; padding: 2rem; }
      .brand { font-size: 1.5rem; letter-spacing: 0.08em; opacity: 0.9; }
      .hint { margin-top: 0.75rem; font-size: 0.85rem; opacity: 0.45; }
      .fatal { display: none; text-align: left; }
      .fatal h2 { margin: 0 0 1rem; font-size: 1.15rem; }
      .fatal pre {
        white-space: pre-wrap;
        word-break: break-word;
        color: #ff9a9a;
        font-size: 0.85rem;
        margin: 0;
      }
      body[data-fatal] .starting { display: none; }
      body[data-fatal] .fatal { display: block; }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="starting">
        <div class="brand">Denia</div>
        <div class="hint">正在启动…</div>
      </div>
      <div class="fatal">
        <h2>denia 启动失败</h2>
        <pre id="fatal-message"></pre>
      </div>
    </div>
    <script>
      var fatal = window.__DENIA_FATAL__
      if (typeof fatal === 'string' && fatal.length > 0) {
        document.body.dataset.fatal = '1'
        document.getElementById('fatal-message').textContent = fatal
      }
    </script>
  </body>
</html>
