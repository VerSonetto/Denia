[package]
name = "denia-mcp"
description = "MCP (Model Context Protocol) client: JSON-RPC over stdio transports"
version.workspace = true
edition.workspace = true
license.workspace = true

# 共享 fixture 放 tests/common/ 子目录:不会被自动发现为 test target,
# 只作为上面的 [[bin]] 构建,避免 "present in multiple build targets" 警告。
[[bin]]
name = "denia-mcp-fixture"
path = "tests/common/fixture_server.rs"

[[bin]]
name = "denia-mcp-http-fixture"
path = "tests/common/http_fixture_server.rs"

[dependencies]
denia-core = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
arc-swap = { workspace = true }
reqwest = { workspace = true }
futures = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
