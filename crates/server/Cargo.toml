[package]
name = "denia-server"
description = "axum HTTP API + SSE push + console hosting (bin: denia)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "denia"
path = "src/main.rs"

[dependencies]
denia-core = { workspace = true }
denia-settings = { workspace = true }
denia-credentials = { workspace = true }
denia-llm = { workspace = true }
denia-tools = { workspace = true }
denia-mcp = { workspace = true }
denia-session = { workspace = true }
denia-agent-loop = { workspace = true }
denia-browser = { workspace = true }
denia-system-prompt = { workspace = true }

tokio = { workspace = true }
tokio-stream = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
axum = { workspace = true }
http = { workspace = true }
reqwest = { workspace = true }
rust-embed = { workspace = true }
mime_guess = { workspace = true }
rfd = { workspace = true }
uuid = { workspace = true }
base64 = { workspace = true }
sha2 = "0.10"
async-trait = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
arc-swap = { workspace = true }
notify = "6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
