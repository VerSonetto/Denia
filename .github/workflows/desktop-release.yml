name: Desktop release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '新 Release 标签（例如 v0.4.3-beta）；必须与本地版本一致，留空使用本地版本'
        required: false
        type: string
      release_notes:
        description: '本次更新日志（Markdown，必填；gh 可用 -F release_notes=@文件路径 传入多行正文）'
        required: true
        type: string
      prerelease:
        description: '标记为预发布'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  windows:
    name: Build Windows x64
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always
      RELEASE_TAG_INPUT: ${{ inputs.tag }}
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate release inputs
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_NOTES_INPUT: ${{ inputs.release_notes }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_NOTES_INPUT)) { throw 'Release notes are required. Provide the actual changelog for this version.' }
          $tag = node .github/scripts/release-version.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Release versions are inconsistent. Synchronize Cargo.toml, desktop config, frontend package and Cargo.lock first.' }
          $tag = $tag.Trim()
          $existing = gh api "repos/$env:GITHUB_REPOSITORY/git/matching-refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot check existing tags.' }
          if (($existing | ConvertFrom-Json) | Where-Object { $_.ref -eq "refs/tags/$tag" }) { throw "Tag already exists: $tag. Choose a new tag." }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-windows-x64

      - name: Install frontend dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: Build frontend
        working-directory: web
        run: |
          pnpm exec vite build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/precompress.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path 'dist/index.html')) { throw 'Frontend build produced no index.html.' }

      # 编译与打包一步完成：tauri build 内部会自己跑 cargo(带上它自己的
      # features 与 build script)。此前先手写一次 `cargo build -p denia-desktop`
      # 再调 tauri build，等于把最贵的编译做了两遍。
      - name: Build desktop and Windows installer
        working-directory: crates/desktop
        run: |
          pnpm dlx @tauri-apps/cli@2 build --target x86_64-pc-windows-msvc --bundles nsis --config tauri.release.conf.json -- --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path '../../target/x86_64-pc-windows-msvc/release/denia-desktop.exe')) { throw 'Desktop executable is missing.' }

      - name: Prepare release executables
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          $package = "Denia-$env:RELEASE_TAG-windows-x64"
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item 'target/x86_64-pc-windows-msvc/release/denia-desktop.exe' "release/$package.exe"
          $installers = @(Get-ChildItem 'target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe' -File)
          if ($installers.Count -ne 1) { throw 'Expected exactly one NSIS installer.' }
          Copy-Item $installers[0].FullName "release/$package-setup.exe"
          $checksums = Get-ChildItem 'release/*.exe' -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $checksums | Set-Content 'release/SHA256SUMS.txt' -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-x64
          path: |
            release/*.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: desktop-windows-x64
          path: release
      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.windows.outputs.tag }}
          RELEASE_PRERELEASE: ${{ inputs.prerelease }}
          RELEASE_NOTES_INPUT: ${{ inputs.release_notes }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_NOTES_INPUT)) { throw 'Release notes are required. Refusing to publish an empty changelog.' }
          $notesPath = Join-Path $env:RUNNER_TEMP 'denia-release-notes.md'
          [System.IO.File]::WriteAllText($notesPath, $env:RELEASE_NOTES_INPUT, [System.Text.UTF8Encoding]::new($false))
          $files = @(Get-ChildItem release -File | ForEach-Object { $_.FullName })
          if ($files.Count -ne 3) { throw 'Expected standalone EXE, NSIS setup EXE and SHA256SUMS.txt.' }
          $arguments = @('release', 'create', $env:RELEASE_TAG, '--target', $env:GITHUB_SHA, '--title', "Denia $env:RELEASE_TAG", '--notes-file', $notesPath)
          if ($env:RELEASE_PRERELEASE -eq 'true') { $arguments += '--prerelease' }
          & gh @arguments @files
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
